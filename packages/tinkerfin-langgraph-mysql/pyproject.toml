[project]
name = "tinkerfin-langgraph-mysql"
version = "0.1.0"
description = "Asyncmy-only MySQL Store integration for LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "asyncmy==0.2.14",
    "langgraph-checkpoint==4.2.0",
    "orjson==3.11.9",
    "typing-extensions>=4.12.2,<5",
]

[project.urls]
Homepage = "https://github.com/tinkerfin-ai/tinkerfin"
Repository = "https://github.com/tinkerfin-ai/tinkerfin"
Issues = "https://github.com/tinkerfin-ai/tinkerfin/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "langgraph.store.mysql*",
    "tinkerfin_langgraph_mysql*",
]
namespaces = true

[tool.setuptools.package-data]
"langgraph.store.mysql" = ["py.typed"]
tinkerfin_langgraph_mysql = ["py.typed"]
