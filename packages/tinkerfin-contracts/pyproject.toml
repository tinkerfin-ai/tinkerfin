[project]
name = "tinkerfin-contracts"
version = "0.1.0"
description = "Protocol-neutral runtime observation contracts for TinkerFin integrations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/tinkerfin-ai/tinkerfin"
Repository = "https://github.com/tinkerfin-ai/tinkerfin"
Issues = "https://github.com/tinkerfin-ai/tinkerfin/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin_contracts = ["py.typed"]
