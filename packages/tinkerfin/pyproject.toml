[project]
name = "tinkerfin"
version = "0.1.0"
description = "Stateless native, AG-UI, and SSE streaming for LangGraph graphs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "ag-ui-protocol==0.1.19",
    "deepagents>=0.7.5,<0.8.0",
    "langchain-core>=1.5.3,<1.6.0",
    "langgraph>=1.2.10,<1.3.0",
    "pydantic>=2,<3",
    "tinkerfin-agui-adapter>=0.1.0,<0.9.0",
]

[project.optional-dependencies]
redis = ["redis>=6,<9"]

[project.urls]
Homepage = "https://github.com/tinkerfin-ai/tinkerfin"
Repository = "https://github.com/tinkerfin-ai/tinkerfin"
Issues = "https://github.com/tinkerfin-ai/tinkerfin/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin = ["*.pyi", "py.typed"]

[tool.uv.sources]
tinkerfin-agui-adapter = { workspace = true }
