[project]
name = "tinkerfin"
version = "0.1.0"
description = "Request-scoped Native, Plan, Observation, and optional AG-UI streaming."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "anyio>=4,<5",
    "deepagents==0.7.5",
    "langchain==1.3.14",
    "langchain-core==1.5.3",
    "langgraph==1.2.10",
    "jsonschema>=4.25,<5",
    "pydantic>=2,<3",
    "tinkerfin-contracts>=0.1.0,<0.9.0",
    "tinkerfin-native-stream>=0.1.0,<0.9.0",
    "tzdata>=2025.2",
    "typing-extensions>=4.12.2,<5",
    "wcmatch>=11,<12",
]

[project.optional-dependencies]
agui = [
    "ag-ui-protocol==0.1.19",
    "tinkerfin-agui-adapter>=0.1.0,<0.9.0",
]
redis = ["redis>=6,<9"]

[project.urls]
Homepage = "https://github.com/tinkerfin-ai/tinkerfin"
Repository = "https://github.com/tinkerfin-ai/tinkerfin"
Issues = "https://github.com/tinkerfin-ai/tinkerfin/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin = ["*.pyi", "py.typed"]

[tool.uv.sources]
tinkerfin-agui-adapter = { workspace = true }
tinkerfin-contracts = { workspace = true }
tinkerfin-native-stream = { workspace = true }
