[project]
name = "tinkerfin-studio"
dynamic = ["version"]
description = "Server application for TinkerFin Studio."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "ag-ui-protocol==0.1.19",
    "anyio>=4,<5",
    "asyncmy==0.2.14",
    "deepagents==0.7.5",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "langchain==1.3.14",
    "langchain-core==1.5.3",
    "langchain-deepseek==1.1.0",
    "langchain-openai==1.4.3",
    "langgraph==1.2.10",
    "langgraph-checkpoint-redis==0.5.1",
    "opensandbox==0.1.14",
    "pydantic>=2,<3",
    "pydantic-settings>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6.0.3,<7",
    "redis>=6,<9",
    "sqlalchemy[asyncio]==2.0.52",
    "starlette>=0.46,<1",
    "tavily-python>=0.7,<1",
    "tinkerfin[agui,redis]>=0.1.0,<0.9.0",
    "tinkerfin-langgraph-mysql>=0.1.0,<0.9.0",
    "tinkerfin-messaging[agui,redis]>=0.1.0,<0.9.0",
    "tinkerfin-sandbox[mysql]>=0.1.0,<0.9.0",
    "tinkerfin-tracing[mysql]>=0.1.0,<0.9.0",
    "uvicorn[standard]>=0.52,<1",
]

[project.scripts]
tinkerfin-studio = "tinkerfin_studio.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "tinkerfin_studio.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin_studio = ["agent/*.yaml"]
