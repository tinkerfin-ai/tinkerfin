[project]
name = "tinkerfin-studio"
dynamic = ["version"]
description = "Server application for TinkerFin Studio."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "ag-ui-protocol==0.1.19",
    "anyio>=4,<5",
    "asyncmy>=0.2.11,<1",
    "deepagents==0.7.5",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "langchain==1.3.14",
    "langchain-core==1.5.3",
    "langchain-deepseek==1.1.0",
    "langchain-openai==1.4.3",
    "langgraph==1.2.10",
    "langgraph-checkpoint-mysql[aiomysql,asyncmy,pymysql]==3.0.0",
    "langgraph-checkpoint-redis==0.5.1",
    "langsmith>=0.10.9,<1",
    "jsonpatch>=1.33,<2",
    "pydantic-settings>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6.0.3,<7",
    "redis>=6,<9",
    "sqlalchemy[asyncio]>=2.0.48,<3",
    "tavily-python>=0.7,<1",
    "tinkerfin[redis]>=0.1.0,<0.9.0",
    "tinkerfin-messaging[agui,redis]>=0.1.0,<0.9.0",
    "tinkerfin-sandbox[mysql]>=0.1.0,<0.9.0",
    "uvicorn[standard]>=0.52,<1",
]

[project.scripts]
tinkerfin-studio = "tinkerfin_studio.__main__:main"
tinkerfin-studio-manage = "tinkerfin_studio.manage:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "tinkerfin_studio.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin_studio = ["agent/*.yaml"]
